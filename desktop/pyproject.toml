[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agzs-station"
version = "0.3.0"
description = "Пульт колонок. Окно PySide6 отдаёт смену и отпуск на API Цифрового следа."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.8"]

[project.scripts]
agzs-station = "agzs_station.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agzs_station*"]
