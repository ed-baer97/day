services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lpg
      POSTGRES_PASSWORD: lpg
      POSTGRES_DB: lpg_trace
    ports:
      - "5432:5432"
    volumes:
      - lpg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpg -d lpg_trace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://lpg:lpg@db:5432/lpg_trace
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lpg_pgdata:
