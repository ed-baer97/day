# Площадка: учёт в Postgres, state.json только для разового переноса.
# Секреты — в deploy/.env, его нет в git.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lpg_trace
    volumes:
      - lpg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpg -d lpg_trace"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://lpg:${POSTGRES_PASSWORD}@db:5432/lpg_trace
      ACCOUNT_STORE: postgres
      CORS_ORIGINS: ${CORS_ORIGINS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      INGEST_TOKEN: ${INGEST_TOKEN}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      SENSOR_STALE_SECONDS: ${SENSOR_STALE_SECONDS:-60}
      STATE_PATH: /data/state.json
    volumes:
      - lpg_state:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  lpg_pgdata:
  lpg_state:
