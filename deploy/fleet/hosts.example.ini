# Пример инвентаря Ansible для сети из 100+ АГЗС через Mesh-VPN (Headscale / WireGuard)
# Запуск только для Кольца 0 (1–2 станции рядом с инженером, обкатка сутки):
#   ansible-playbook -i hosts.example.ini update-stations.yml --limit ring0
# Запуск для Кольца 1 (10% станций, обкатка 1 смену):
#   ansible-playbook -i hosts.example.ini update-stations.yml --limit ring1
# Волновая раскатка на весь парк (Кольцо 2 — 90% станций, обновление во время простоя):
#   ansible-playbook -i hosts.example.ini update-stations.yml

[ring0]
agzs-akt-12mkr ansible_host=100.64.0.11 station_code=AKT-12MKR update_channel=ring0
agzs-akt-28mkr ansible_host=100.64.0.12 station_code=AKT-28MKR update_channel=ring0

[canary:children]
ring0

[ring1]
agzs-akt-001 ansible_host=100.64.0.21 station_code=AKT-001 update_channel=ring1
agzs-akt-002 ansible_host=100.64.0.22 station_code=AKT-002 update_channel=ring1

[ring2]
agzs-akt-003 ansible_host=100.64.1.3 station_code=AKT-003 update_channel=ring2
# ...
agzs-ala-150 ansible_host=100.64.2.50 station_code=ALA-150 update_channel=ring2

[production:children]
ring2

[agzs_fleet:children]
ring0
ring1
ring2

[agzs_fleet:vars]
ansible_user=agzs
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
edge_dir=/opt/station-edge
